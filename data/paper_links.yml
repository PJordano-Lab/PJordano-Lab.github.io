# Code and data links shown on individual publication pages.
#
# Keyed by the paper's DOI (bare, no https://doi.org/ prefix). open-alex.py
# reads this file and appends the links to the "## Links" line of
# research/articles/<slug>/index.qmd. Those pages are regenerated on every
# sync, which is why the links live here and not in the pages themselves.
# This file is never overwritten by a sync.
#
# Keys per paper, all optional:
#   code:   repository or archived code (Zenodo, figshare, GitHub)
#   data:   dataset or supplement
#   extra:  any further links, as a list of {label, url}
# When code and data are the same URL the page shows a single "Code & data".
#
# Candidate entries can be generated from the deposits already in
# data/publications.csv:
#     python _tools/propose-paper-links.py
# then review data/paper_links.proposed.yml and data/paper_links_review.csv and
# copy the entries you accept below.
#
# Example:
#   "10.1111/geb.13452":
#     code: https://doi.org/10.6084/m9.figshare.9977420
#     data: https://doi.org/10.6084/m9.figshare.9977420
#   "10.1002/oik.11991":
#     data: https://doi.org/10.5281/zenodo.19482637
#     extra:
#       - label: Shiny app
#         url: https://example.org/app

# ---------------------------------------------------------------------------
# Accepted 2026-09 from data/paper_links.proposed.yml (see comments for how
# each pairing was established: datacite:<relation> = registered metadata,
# title <score> = similarity match).
# ---------------------------------------------------------------------------

