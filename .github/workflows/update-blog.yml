name: Mirror WordPress blog

on:
  schedule:
    # 05:17 UTC every Monday and Thursday
    - cron: "17 5 * * 1,4"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render every post and re-download every image"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: "wordpress-mirror"
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync posts from WordPress
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python fetch-wordpress.py --force
          else
            python fetch-wordpress.py
          fi

      - name: Commit any changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/posts data/wordpress_posts.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new or edited posts."
          else
            n=$(git diff --cached --name-only | grep -c 'index.qmd' || true)
            git commit -m "Mirror WordPress blog: ${n} post page(s) updated"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # Pages deploy has to be asked for explicitly.
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run static.yml --ref master
