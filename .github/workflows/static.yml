name: Deploy Quarto site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
      
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Render Quarto site
        run: quarto render

      # The CV is copied by _tools/publish-cv.sh during post-render. A broken
      # copy step previously left an empty DIRECTORY at docs/cv/cv.pdf, which
      # Pages serves as a 301 to /cv/cv.pdf/ and then a 404 - and the render
      # still exited 0, so the workflow stayed green. Fail here instead.
      - name: Verify the CV was published
        run: |
          test -f docs/cv/cv.pdf || { echo "docs/cv/cv.pdf is missing or is a directory"; ls -la docs/cv || true; exit 1; }
          cmp -s cv/cv.pdf docs/cv/cv.pdf || { echo "docs/cv/cv.pdf differs from cv/cv.pdf"; exit 1; }
          echo "CV published: $(wc -c < docs/cv/cv.pdf) bytes"

      - name: Setup Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: 'docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
