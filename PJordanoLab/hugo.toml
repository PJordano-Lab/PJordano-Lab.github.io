baseURL = "http://pjordanolab.ebd.csic.es/"
locale = "en"
defaultContentLanguage = "en"
title = "Pedro Jordano Lab"
theme = "paper"
enableRobotsTXT = true
enableInlineShortcodes = true

[pagination]
  pagerSize = 10

[params]
  name = "Pedro Jordano Lab"
  bio = "Ecology and evolution of plant-animal interactions. Estacion Biologica de Donana, CSIC, Sevilla."
  color = "linen"
  # Home lists no post sections; navigation is via the menu defined in each page's front matter.
  mainSections = []

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true          # imported pages contain inline HTML

[taxonomies]
  category = "categories"
  tag = "tags"
