<!-- Dark Mode Toggle -->
<style>
  .theme-toggle {
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 2rem;
    padding: 0.35rem 0.75rem;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    color: #f8f7f4;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    font-weight: 500;
    line-height: 1;
    white-space: nowrap;
  }

  .theme-toggle:hover {
    background: rgba(255, 255, 255, 0.20);
    border-color: rgba(255, 255, 255, 0.45);
  }

  .theme-toggle i {
    font-size: 1rem;
  }

  /* keep it clear of the social icons */
  .quarto-navbar-tools .theme-toggle {
    margin-left: 0.6rem;
  }
</style>

<script>
  (function() {
    var BTN_HTML = {
      dark:  '<i class="bi bi-sun-fill"></i> Light',
      light: '<i class="bi bi-moon-stars-fill"></i> Dark'
    };

    function currentTheme() {
      return document.documentElement.getAttribute('data-theme') || 'light';
    }

    // Body classes can only be set once <body> exists. This script sits in
    // <head>, so during first parse document.body is still null - touching it
    // there threw a TypeError that killed the rest of this IIFE, which is why
    // no toggle button was ever injected.
    function applyBodyClasses(theme) {
      if (!document.body) return;
      document.body.classList.toggle('quarto-dark', theme === 'dark');
      document.body.classList.toggle('quarto-light', theme !== 'dark');
    }

    function refreshButtons(theme) {
      var label = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
      var buttons = document.querySelectorAll('.theme-toggle');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].innerHTML = BTN_HTML[theme === 'dark' ? 'dark' : 'light'];
        buttons[i].setAttribute('aria-label', label);
        buttons[i].setAttribute('title', label);
      }
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem('theme', theme); } catch (e) {}
      applyBodyClasses(theme);
      refreshButtons(theme);
    }

    // Set the attribute before first paint so there is no flash of the wrong
    // theme; the body/button work happens once the DOM is ready.
    var saved = 'dark';
    try { saved = localStorage.getItem('theme') || 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', saved);

    window.toggleTheme = function() {
      applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
    };

    function addToggleButton() {
      var theme = currentTheme();
      var containers = document.querySelectorAll('.quarto-navbar-tools');
      for (var i = 0; i < containers.length; i++) {
        if (containers[i].querySelector('.theme-toggle')) continue;
        var btn = document.createElement('button');
        btn.id = i === 0 ? 'theme-toggle-btn' : 'theme-toggle-btn-' + i;
        btn.className = 'theme-toggle';
        btn.type = 'button';
        btn.addEventListener('click', window.toggleTheme);
        containers[i].appendChild(btn);
      }
      applyBodyClasses(theme);
      refreshButtons(theme);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', addToggleButton);
    } else {
      addToggleButton();
    }
  })();
</script>
