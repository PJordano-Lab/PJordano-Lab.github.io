{{- define "main" -}}
{{/* Two-column page layout: figures left, text right.
     Applied via `layout = "twocolumn"` in a page's front matter. */}}
<link rel="stylesheet" href="{{ "css/twocolumn.css" | relURL }}" />
<article class="tc-page">
  <header class="mb-10">
    <h1 class="my-0! pb-2.5">{{- .Title -}}</h1>
  </header>
  <section>{{- .Content -}}</section>
</article>
{{- end -}}
