enableRobotsTXT: true
pagination:
    pagerSize: 200
taxonomies: {}
disableKinds: ["taxonomy", "term", "rss"]

params:
    author: "Pedro Jordano"
    description: "Jordano Lab, Estacion Biologica de Donana (CSIC): ecology and evolution of plant-animal interactions, frugivory, seed dispersal, and mutualistic networks."
    DateFormat: "2006"
    assets:
