project:
  type: website
  post-render:
    - "mkdir -p docs/cv && cp cv/cv.pdf docs/cv/cv.pdf"
  render:
    - "*.qmd"
    - "!cv/**"
    - "!teaching/**"
    - "!publications/**"
    - "!datasets/**"
    - "!resources/**"
    - "!projects/**"
  # pre-render scripts: run locally as needed, not in CI
  # pre-render:
  #   - Rscript cv/cv_render.R
  #   - Rscript call-scholar-stats.R
  #   - Rscript call-python.R
  resources:
    - cv/cv.pdf
    - CNAME
    - .nojekyll
  output-dir: docs

freeze: true

website:
  title: "Pedro Jordano Lab"
  navbar:
    pinned: true
    background: dark
    foreground: light
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Publications
      - href: projects.qmd
        text: Projects
      - href: people.qmd
        text: People
      - text: Resources
        menu:
          - href: resources.qmd
            text: Resources
          - href: datasets.qmd
            text: Datasets
          - href: teaching.qmd
            text: Teaching
          - href: gallery.qmd
            text: Gallery
          - href: media.qmd
            text: Media

      # - text: Projects
      #   menu:
      #     - text: Truleo
      #       href: projects/truleo.qmd
      #     - text: Tempe Opioid Recovery Project
      #       href: projects/orp.qmd

      - href: cv/cv.pdf
        text: CV
    tools:
      - icon: github
        href: https://github.com/pedroj
        target: _blank
      - icon: twitter-x
        href: https://x.com/pedro_jordano
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/pedro-jordano-2a0961a9/
        target: _blank

  page-footer:
    center: "Pedro Jordano &copy; <script>document.write(new Date().getFullYear())</script>"
    right:
      - icon: github
        href: https://github.com/pedroj
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/pedro-jordano-2a0961a9/
        target: _blank
      - icon: envelope
        href: mailto:jordano@ebd.csic.es

  site-url: "https://pjordano-lab.github.io/"

format:
  html:
    theme: html/pedroj.scss
    grid:
      body-width: 900px
    toc: false
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    include-in-header:
      - "files/includes/_fonts.html"
      - "files/includes/_dark-mode-toggle.html"
editor: visual
